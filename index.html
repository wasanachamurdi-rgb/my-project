<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level III Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8;
  --panel:#FFFFFF;
  --panel-2:#F1F4F8;
  --line:#D9E0E8;
  --line-soft:#E8EDF2;
  --text:#1C2530;
  --muted:#5C6C7E;
  --muted-2:#8A97A6;
  --accent:#0E9C89;
  --accent-dim:#DBF3EF;
  --air:#2E86C9;
  --water:#1F5C99;
  --soil:#9C6A2E;
  --sediment:#6E5686;
  --warn:#B8791C;
  --danger:#C2453C;
  --radius:10px;
  --serif-display: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
body{min-height:100vh;}
::selection{background:var(--accent-dim);color:var(--text);}
a{color:var(--accent);}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}

#app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:36px;height:36px;border-radius:8px;
  background:conic-gradient(from 220deg, var(--air), var(--water) 30%, var(--soil) 62%, var(--sediment) 100%);
  flex-shrink:0;
  box-shadow:0 0 0 1px var(--line-soft), inset 0 0 12px rgba(0,0,0,.35);
}
.brand-text h1{font-family:var(--serif-display);font-size:18px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand-text p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono);}
.topbar-actions{display:flex;gap:10px;}

/* Stepper */
.stepper{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
.step-pill{
  flex:1;min-width:140px;
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px 9px 10px;font-size:12.5px;color:var(--muted);
  transition:all .15s ease;cursor:default;
}
.step-pill .num{
  width:22px;height:22px;border-radius:50%;background:var(--panel-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0;
}
.step-pill.active{border-color:var(--accent);color:var(--text);background:rgba(14,156,137,.08);}
.step-pill.active .num{background:var(--accent);border-color:var(--accent);color:#04201B;font-weight:600;}
.step-pill.done{color:var(--text);}
.step-pill.done .num{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.step-pill.clickable{cursor:pointer;}
.step-pill.clickable:hover{border-color:var(--muted-2);}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;margin-bottom:20px;
}
.card h2{font-family:var(--serif-display);font-size:20px;margin:0 0 4px;font-weight:600;}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 22px;}

.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:10px 12px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .12s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field .hint{font-size:11px;color:var(--muted-2);}
.field textarea{resize:vertical;min-height:64px;}

.btn{
  border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--text);padding:10px 18px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:8px;transition:all .12s;
}
.btn:hover{border-color:var(--muted-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04201B;font-weight:600;}
.btn-primary:hover{background:#4FDCC9;}
.btn-primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed;}
.btn-ghost{background:transparent;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{color:var(--danger);}

.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{
  border:1px solid var(--line);background:var(--panel-2);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--muted);
}
.chip.active{border-color:var(--accent);color:var(--text);background:rgba(14,156,137,.1);}
.chip.clickable{cursor:pointer;}
.chip.clickable:hover{border-color:var(--muted-2);}

.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px;}
.preset-card{
  border:1px solid var(--line);background:var(--panel-2);border-radius:8px;
  padding:14px;cursor:pointer;transition:all .12s;
}
.preset-card:hover{border-color:var(--muted-2);}
.preset-card.selected{border-color:var(--accent);background:rgba(14,156,137,.08);}
.preset-card .pname{font-weight:600;font-size:13.5px;margin-bottom:3px;}
.preset-card .pmeta{font-size:11px;color:var(--muted);font-family:var(--mono);}
.preset-card .ptag{display:inline-block;margin-top:8px;font-size:10px;padding:2px 7px;border-radius:4px;background:var(--panel);color:var(--muted);font-family:var(--mono);}
.preset-card .ptag.custom{color:var(--accent);border:1px solid var(--accent-dim);}

.section-title{font-family:var(--serif-display);font-size:14.5px;font-weight:600;margin:22px 0 12px;color:var(--text);
  display:flex;align-items:center;gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table th{
  text-align:left;font-family:var(--mono);font-weight:500;color:var(--muted);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.data-table td{padding:7px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);white-space:nowrap;}
table.data-table tr.subrow td:first-child{color:var(--muted);padding-left:22px;}
table.data-table tr.bulkrow td{font-weight:600;background:rgba(15,30,45,.025);}
table.data-table tr.bulkrow.air td:first-child{border-left:3px solid var(--air);}
table.data-table tr.bulkrow.water td:first-child{border-left:3px solid var(--water);}
table.data-table tr.bulkrow.soil td:first-child{border-left:3px solid var(--soil);}
table.data-table tr.bulkrow.sediment td:first-child{border-left:3px solid var(--sediment);}
table.data-table tr.totalrow td{font-weight:700;border-top:1px solid var(--line);color:var(--accent);}
.table-wrap{overflow-x:auto;margin-bottom:8px;}

.results-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0;}
.rtab{
  padding:9px 14px;font-size:12.5px;color:var(--muted);background:transparent;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--body);font-weight:500;
}
.rtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.rtab:hover{color:var(--text);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.kpi .kval{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--accent);}
.kpi .klabel{font-size:11px;color:var(--muted);margin-top:3px;}

.compartment-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.leg-swatch{width:10px;height:10px;border-radius:3px;}

.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);}

.footer-note{font-size:11.5px;color:var(--muted-2);margin-top:6px;}

.save-row{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft);}
.save-row input[type=text]{flex:1;min-width:160px;}

.empty-note{color:var(--muted);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;}

/* charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:760px){.chart-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;}
.chart-box h4{margin:0 0 12px;font-size:12.5px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:500;}

.chart-dialog{display:grid;grid-template-columns:200px 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
@media(max-width:640px){.chart-dialog{grid-template-columns:1fr;}}
.chart-selector{background:var(--panel-2);padding:18px;border-right:1px solid var(--line);}
@media(max-width:640px){.chart-selector{border-right:none;border-bottom:1px solid var(--line);}}
.chart-selector-title{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;}
.chart-radio{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;}
.chart-radio:hover{background:rgba(15,30,45,.035);}
.chart-radio.active{color:var(--text);font-weight:600;}
.chart-radio input{accent-color:var(--accent);width:15px;height:15px;}
.chart-display{padding:22px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;}
.chart-display-title{font-family:var(--serif-display);font-size:15px;font-weight:600;margin-bottom:16px;text-align:center;}
.pie-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;}
.pie-legend{display:flex;flex-direction:column;gap:10px;}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}

/* diagram */
.diagram-wrap{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;}

/* print */
@media print{
  body{background:#fff;color:#111;}
  #app{max-width:100%;padding:0;}
  .no-print{display:none !important;}
  .card{background:#fff;border:1px solid #ccc;break-inside:avoid;}
  table.data-table td, table.data-table th{color:#111;border-color:#ddd;}
  .kpi{background:#f7f7f7;border-color:#ccc;}
  .kpi .kval{color:#0a6b5f;}
  .chart-box{background:#f7f7f7;border-color:#ccc;}
  .topbar{border-color:#ccc;}
  .brand-text p{color:#555;}
}

.wizard-locked{opacity:.45;pointer-events:none;}

/* AI Insights */
.ai-panel{max-width:760px;}
.ai-response{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;margin-top:16px;font-size:13.5px;color:var(--text);
}
.ai-chatlog{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
.ai-msg{border-radius:8px;padding:12px 14px;font-size:13.5px;}
.ai-msg-user{background:var(--panel-2);border:1px solid var(--line);}
.ai-msg-ai{background:var(--accent-dim);border:1px solid var(--accent);}
.ai-msg-label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
.ai-ask-row{display:flex;gap:10px;align-items:flex-end;}
.ai-ask-row textarea{flex:1;min-height:56px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;color:var(--text);font-size:13.5px;font-family:var(--body);resize:vertical;}

.select-native{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235C6C7E'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px !important;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--accent);
  color:var(--text);padding:12px 18px;border-radius:8px;font-size:13px;z-index:999;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   LEVEL III FUGACITY MODEL — calculation engine
   Faithful JS port of the Trent University EQC Level III VBA model.
   Validated against the Benzene / EQC-standard-environment reference case.
   ========================================================================= */
const GASCNST = 8.314;
const LN2 = Math.log(2);
const AIR='AIR', WATER='WATER', SOIL='SOIL', SEDIMENT='SEDIMENT', SUSP='SUSP', FISH='FISH', AEROSOL='AEROSOL';
const VAPOUR='VAPOUR', LIQUID='LIQUID', SOLID='SOLID', BIOTA='BIOTA';

function computeZValues(chem, env, TempK){
  if(chem.type===1){
    const WatSolM = chem.watSol / chem.molWgt;
    const HenLw = chem.vapPress / WatSolM;
    const KOW = Math.pow(10, chem.lKow);
    const KOC = 0.41*KOW;
    const KFW = env.lipidFish*KOW;
    const MeltPtK = chem.meltPt + 273.15;
    const FugRatio = (MeltPtK>TempK) ? Math.exp(6.79*(1-(MeltPtK/TempK))) : 1;
    const LiqVapPress = chem.vapPress/FugRatio;
    const zSub = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
    zSub.AIR.VAPOUR = 1/GASCNST/TempK;
    zSub.AIR.SOLID = (zSub.AIR.VAPOUR*6000000)/LiqVapPress;
    zSub.WATER.LIQUID = 1/HenLw;
    zSub.WATER.SOLID = (zSub.WATER.LIQUID*env.densWaterSusp*env.orgCarbSusp*KOC)/1000;
    zSub.WATER.BIOTA = zSub.WATER.LIQUID*KFW;
    zSub.SOIL.VAPOUR = zSub.AIR.VAPOUR;
    zSub.SOIL.LIQUID = zSub.WATER.LIQUID;
    zSub.SOIL.SOLID = (zSub.WATER.LIQUID*env.densSoilSolid*env.orgCarbSoil*KOC)/1000;
    zSub.SEDIMENT.LIQUID = zSub.WATER.LIQUID;
    zSub.SEDIMENT.SOLID = (zSub.WATER.LIQUID*env.densSedimentSolid*env.orgCarbSediment*KOC)/1000;
    return zSub;
  } else if(chem.type===2){
    const Part3_2 = chem.part3_2_D*env.densSoilSolid/1000;
    const Part4_2 = chem.part4_2_D*env.densSedimentSolid/1000;
    const Part5_2 = chem.part5_2_D*env.densWaterSusp/1000;
    const Part6_2 = chem.part6_2_D*env.densWaterFish/1000;
    const zSub = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
    zSub.WATER.LIQUID = 1;
    zSub.AIR.VAPOUR = zSub.WATER.LIQUID*chem.part1_2;
    zSub.SOIL.SOLID = zSub.WATER.LIQUID*Part3_2;
    zSub.SEDIMENT.SOLID = zSub.WATER.LIQUID*Part4_2;
    zSub.WATER.SOLID = zSub.WATER.LIQUID*Part5_2;
    zSub.WATER.BIOTA = zSub.WATER.LIQUID*Part6_2;
    zSub.AIR.SOLID = zSub.WATER.LIQUID*chem.part7_2;
    zSub.SEDIMENT.LIQUID = zSub.WATER.LIQUID;
    zSub.SOIL.VAPOUR = zSub.AIR.VAPOUR;
    zSub.SOIL.LIQUID = zSub.WATER.LIQUID;
    return zSub;
  } else {
    const zSub = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
    zSub.AIR.VAPOUR = 1/GASCNST/TempK;
    zSub.WATER.LIQUID = zSub.AIR.VAPOUR*chem.part2_1;
    zSub.SOIL.SOLID = zSub.AIR.VAPOUR*chem.part3_1;
    zSub.SEDIMENT.SOLID = zSub.AIR.VAPOUR*chem.part4_1;
    zSub.WATER.SOLID = zSub.AIR.VAPOUR*chem.part5_1;
    zSub.WATER.BIOTA = zSub.AIR.VAPOUR*chem.part6_1;
    zSub.AIR.SOLID = zSub.AIR.VAPOUR*chem.part7_1;
    zSub.SOIL.VAPOUR = zSub.AIR.VAPOUR;
    zSub.SOIL.LIQUID = zSub.WATER.LIQUID;
    zSub.SEDIMENT.LIQUID = zSub.WATER.LIQUID;
    return zSub;
  }
}

function runLevel3Model(chem, env, emis){
  const TempK = chem.dataTemp + 273.15;
  const DensitySub = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
  DensitySub.AIR.VAPOUR = ((0.029*101325)/GASCNST)/TempK;
  DensitySub.AIR.SOLID = env.densAirAerosol;
  DensitySub.WATER.LIQUID = env.densWaterWater;
  DensitySub.WATER.SOLID = env.densWaterSusp;
  DensitySub.WATER.BIOTA = env.densWaterFish;
  DensitySub.SOIL.VAPOUR = DensitySub.AIR.VAPOUR;
  DensitySub.SOIL.LIQUID = env.densWaterWater;
  DensitySub.SOIL.SOLID = env.densSoilSolid;
  DensitySub.SEDIMENT.LIQUID = env.densWaterWater;
  DensitySub.SEDIMENT.SOLID = env.densSedimentSolid;

  const zSub = computeZValues(chem, env, TempK);

  // Volumes
  const Area = {};
  Area.AIR = env.airArea;
  Area.WATER = env.waterArea;
  Area.SOIL = Area.AIR - Area.WATER;
  Area.SEDIMENT = Area.WATER;
  const Depth = {AIR:env.airDepth,WATER:env.waterDepth,SOIL:env.soilDepth,SEDIMENT:env.sedimentDepth};
  const VolumeBulk = {};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=> VolumeBulk[m]=Area[m]*Depth[m]);

  const VolumeFract = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
  VolumeFract.AIR.SOLID = env.volFracAirAerosol;
  VolumeFract.AIR.VAPOUR = 1-VolumeFract.AIR.SOLID;
  VolumeFract.WATER.SOLID = env.volFracWaterSusp;
  VolumeFract.WATER.BIOTA = env.volFracWaterFish;
  VolumeFract.WATER.LIQUID = 1-VolumeFract.WATER.SOLID-VolumeFract.WATER.BIOTA;
  VolumeFract.SOIL.VAPOUR = env.volFracSoilAir;
  VolumeFract.SOIL.LIQUID = env.volFracSoilWater;
  VolumeFract.SOIL.SOLID = env.volFracSoilSolid;
  VolumeFract.SEDIMENT.LIQUID = env.volFracSedimentWater;
  VolumeFract.SEDIMENT.SOLID = env.volFracSedimentSolid;

  const VolumeSub = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
  VolumeSub.AIR.VAPOUR = VolumeBulk.AIR*(1-VolumeFract.AIR.SOLID);
  VolumeSub.AIR.SOLID = VolumeFract.AIR.SOLID*VolumeBulk.AIR;
  VolumeSub.WATER.LIQUID = VolumeBulk.WATER*(1-VolumeFract.WATER.SOLID-VolumeFract.WATER.BIOTA);
  VolumeSub.WATER.SOLID = VolumeBulk.WATER*VolumeFract.WATER.SOLID;
  VolumeSub.WATER.BIOTA = VolumeBulk.WATER*VolumeFract.WATER.BIOTA;
  VolumeSub.SOIL.VAPOUR = VolumeFract.SOIL.VAPOUR*VolumeBulk.SOIL;
  VolumeSub.SOIL.LIQUID = VolumeFract.SOIL.LIQUID*VolumeBulk.SOIL;
  VolumeSub.SOIL.SOLID = VolumeFract.SOIL.SOLID*VolumeBulk.SOIL;
  VolumeSub.SEDIMENT.LIQUID = VolumeFract.SEDIMENT.LIQUID*VolumeBulk.SEDIMENT;
  VolumeSub.SEDIMENT.SOLID = VolumeFract.SEDIMENT.SOLID*VolumeBulk.SEDIMENT;

  const zBulk = {};
  zBulk.AIR = VolumeFract.AIR.VAPOUR*zSub.AIR.VAPOUR + VolumeFract.AIR.SOLID*zSub.AIR.SOLID;
  zBulk.WATER = VolumeFract.WATER.LIQUID*zSub.WATER.LIQUID + VolumeFract.WATER.SOLID*zSub.WATER.SOLID + VolumeFract.WATER.BIOTA*zSub.WATER.BIOTA;
  zBulk.SOIL = VolumeFract.SOIL.SOLID*zSub.SOIL.SOLID + VolumeFract.SOIL.VAPOUR*zSub.SOIL.VAPOUR + VolumeFract.SOIL.LIQUID*zSub.SOIL.LIQUID;
  zBulk.SEDIMENT = VolumeFract.SEDIMENT.SOLID*zSub.SEDIMENT.SOLID + VolumeFract.SEDIMENT.LIQUID*zSub.SEDIMENT.LIQUID;

  const DensityBulk = {};
  DensityBulk.AIR = VolumeFract.AIR.VAPOUR*DensitySub.AIR.VAPOUR + VolumeFract.AIR.SOLID*DensitySub.AIR.SOLID;
  DensityBulk.WATER = VolumeFract.WATER.LIQUID*DensitySub.WATER.LIQUID + VolumeFract.WATER.SOLID*DensitySub.WATER.SOLID + VolumeFract.WATER.BIOTA*DensitySub.WATER.BIOTA;
  DensityBulk.SOIL = VolumeFract.SOIL.VAPOUR*DensitySub.SOIL.VAPOUR + VolumeFract.SOIL.LIQUID*DensitySub.SOIL.LIQUID + VolumeFract.SOIL.SOLID*DensitySub.SOIL.SOLID;
  DensityBulk.SEDIMENT = VolumeFract.SEDIMENT.LIQUID*DensitySub.SEDIMENT.LIQUID + VolumeFract.SEDIMENT.SOLID*DensitySub.SEDIMENT.SOLID;

  const ResTimeH = {AIR:env.resTimeAir,WATER:env.resTimeWater,SEDIMENT:env.resTimeSediment};
  const AdvFlowRate = {};
  AdvFlowRate.AIR = VolumeSub.AIR.VAPOUR/ResTimeH.AIR;
  AdvFlowRate.WATER = VolumeSub.WATER.LIQUID/ResTimeH.WATER;
  AdvFlowRate.SOIL = 0;
  AdvFlowRate.SEDIMENT = VolumeBulk.SEDIMENT/ResTimeH.SEDIMENT;
  AdvFlowRate.SUSP = VolumeSub.WATER.SOLID/ResTimeH.WATER;
  AdvFlowRate.FISH = VolumeSub.WATER.BIOTA/ResTimeH.WATER;
  AdvFlowRate.AEROSOL = VolumeSub.AIR.SOLID/ResTimeH.AIR;
  const AdvFlowRateBulk = {};
  AdvFlowRateBulk.AIR = VolumeBulk.AIR/ResTimeH.AIR;
  AdvFlowRateBulk.WATER = VolumeBulk.WATER/ResTimeH.WATER;
  AdvFlowRateBulk.SOIL = 0;
  AdvFlowRateBulk.SEDIMENT = VolumeBulk.SEDIMENT/ResTimeH.SEDIMENT;

  const EmissRateK = {AIR:emis.air,WATER:emis.water,SOIL:emis.soil,SEDIMENT:emis.sediment};
  const EmissRateM = {};
  let TotalEmissRateM=0, TotalEmissRateK=0;
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{
    EmissRateM[m]=EmissRateK[m]*1000/chem.molWgt;
    TotalEmissRateM+=EmissRateM[m];
    TotalEmissRateK+=EmissRateK[m];
  });
  const AdvInflowConcNG = {AIR:emis.inflowAirNG,WATER:emis.inflowWaterNG};
  const AdvInflowConcM = {};
  AdvInflowConcM.AIR = (AdvInflowConcNG.AIR*1e-9)/chem.molWgt;
  AdvInflowConcM.WATER = (AdvInflowConcNG.WATER*1e-6)/chem.molWgt;
  const InflowRateM = {};
  InflowRateM.AIR = AdvFlowRateBulk.AIR*AdvInflowConcM.AIR;
  InflowRateM.WATER = AdvFlowRateBulk.WATER*AdvInflowConcM.WATER;
  const InflowRateK = {};
  InflowRateK.AIR = InflowRateM.AIR*chem.molWgt/1000;
  InflowRateK.WATER = InflowRateM.WATER*chem.molWgt/1000;
  const TotChemInputM = TotalEmissRateM+InflowRateM.AIR+InflowRateM.WATER;
  const TotChemInputK = TotChemInputM*chem.molWgt/1000;

  const TV = env.transVel;
  const Scavenging = env.scavenging;
  const DiffAirWaterAir = Area.WATER*TV[1]*zSub.AIR.VAPOUR;
  const DiffAirWaterWater = Area.WATER*TV[2]*zSub.WATER.LIQUID;
  const DiffAirWaterTotal = (zSub.AIR.VAPOUR===0||DiffAirWaterAir===0||DiffAirWaterWater===0)?0:1/(1/DiffAirWaterAir+1/DiffAirWaterWater);
  const DissRainWater = Area.WATER*TV[3]*zSub.WATER.LIQUID;
  const DepAerosWaterDry = Area.WATER*VolumeFract.AIR.SOLID*TV[4]*zSub.AIR.SOLID;
  const DepAerosWaterWet = Area.WATER*VolumeFract.AIR.SOLID*TV[3]*zSub.AIR.SOLID*Scavenging;
  const DepAerosWaterTotal = DepAerosWaterDry+DepAerosWaterWet;
  const ProcessD = { DiffAirWaterAir, DiffAirWaterWater, DiffAirWaterTotal, DissRainWater, DepAerosWaterDry, DepAerosWaterWet, DepAerosWaterTotal };

  const DVal = {AIR:{},WATER:{},SOIL:{},SEDIMENT:{}};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{ [AIR,WATER,SOIL,SEDIMENT].forEach(ms=>{ DVal[m][ms]=0; }); });
  DVal.WATER.AIR = DiffAirWaterTotal;
  DVal.AIR.WATER = DiffAirWaterTotal+DepAerosWaterTotal+DissRainWater;

  const DiffSoilAirBound = Area.SOIL*TV[7]*zSub.AIR.VAPOUR;
  const DiffSoilAirAir = Area.SOIL*TV[5]*zSub.AIR.VAPOUR;
  const DiffSoilAirWater = Area.SOIL*TV[6]*zSub.WATER.LIQUID;
  const DissRainSoil = Area.SOIL*TV[3]*zSub.WATER.LIQUID;
  const DepAerosSoilDry = Area.SOIL*VolumeFract.AIR.SOLID*TV[4]*zSub.AIR.SOLID;
  const DepAerosSoilWet = Area.SOIL*VolumeFract.AIR.SOLID*TV[3]*zSub.AIR.SOLID*Scavenging;
  const DepAerosSoilTotal = DepAerosSoilDry+DepAerosSoilWet;
  const DiffSoilAirTotal = (zSub.AIR.VAPOUR===0||DiffSoilAirBound===0||(DiffSoilAirWater+DiffSoilAirAir)===0)?0:1/(1/DiffSoilAirBound+1/(DiffSoilAirWater+DiffSoilAirAir));
  DVal.SOIL.AIR = DiffSoilAirTotal;
  DVal.AIR.SOIL = DiffSoilAirTotal+DissRainSoil+DepAerosSoilTotal;
  Object.assign(ProcessD, {DiffSoilAirBound, DiffSoilAirAir, DiffSoilAirWater, DissRainSoil, DepAerosSoilDry, DepAerosSoilWet, DepAerosSoilTotal, DiffSoilAirTotal});

  const DiffWaterSed = Area.WATER*TV[8]*zSub.WATER.LIQUID;
  const DepWaterSed = Area.WATER*TV[9]*zSub.WATER.SOLID;
  const DResusSedWater = Area.SEDIMENT*TV[10]*zSub.SEDIMENT.SOLID;
  DVal.WATER.SEDIMENT = DiffWaterSed+DepWaterSed;
  DVal.SEDIMENT.WATER = DiffWaterSed+DResusSedWater;
  Object.assign(ProcessD, {DiffWaterSed, DepWaterSed, DResusSedWater});

  const DRunoffSoilWaterWater = Area.SOIL*TV[11]*zSub.WATER.LIQUID;
  const DRunoffSoilWaterSolid = Area.SOIL*TV[12]*zSub.SOIL.SOLID;
  DVal.SOIL.WATER = DRunoffSoilWaterWater+DRunoffSoilWaterSolid;
  Object.assign(ProcessD, {DRunoffSoilWaterWater, DRunoffSoilWaterSolid});

  const HLifeH = chem.hLife;
  const ReactRateConst = {};
  [AIR,WATER,SOIL,SEDIMENT,SUSP,FISH,AEROSOL].forEach(m=> ReactRateConst[m]=LN2/HLifeH[m]);

  const DReact = {}, DAdvect = {};
  DReact.AIR = zSub.AIR.VAPOUR*VolumeSub.AIR.VAPOUR*ReactRateConst.AIR;
  DAdvect.AIR = AdvFlowRate.AIR*zSub.AIR.VAPOUR;
  DReact.AEROSOL = zSub.AIR.SOLID*VolumeSub.AIR.SOLID*ReactRateConst.AEROSOL;
  DAdvect.AEROSOL = AdvFlowRate.AEROSOL*zSub.AIR.SOLID;
  DReact.WATER = zSub.WATER.LIQUID*VolumeSub.WATER.LIQUID*ReactRateConst.WATER;
  DAdvect.WATER = AdvFlowRate.WATER*zSub.WATER.LIQUID;
  DReact.SUSP = zSub.WATER.SOLID*VolumeSub.WATER.SOLID*ReactRateConst.SUSP;
  DAdvect.SUSP = AdvFlowRate.SUSP*zSub.WATER.SOLID;
  DReact.FISH = zSub.WATER.BIOTA*VolumeSub.WATER.BIOTA*ReactRateConst.FISH;
  DAdvect.FISH = AdvFlowRate.FISH*zSub.WATER.BIOTA;
  DReact.SOIL = zBulk.SOIL*VolumeBulk.SOIL*ReactRateConst.SOIL;
  DAdvect.SOIL = 0;
  DReact.SEDIMENT = zBulk.SEDIMENT*VolumeBulk.SEDIMENT*ReactRateConst.SEDIMENT;
  DAdvect.SEDIMENT = AdvFlowRate.SEDIMENT*zBulk.SEDIMENT;

  const DReactBulk = {};
  DReactBulk.AIR = DReact.AIR+DReact.AEROSOL;
  DReactBulk.WATER = DReact.WATER+DReact.SUSP+DReact.FISH;
  DReactBulk.SOIL = DReact.SOIL;
  DReactBulk.SEDIMENT = DReact.SEDIMENT;
  const DAdvectBulk = {};
  DAdvectBulk.AIR = DAdvect.AIR+DAdvect.AEROSOL;
  DAdvectBulk.WATER = DAdvect.WATER+DAdvect.SUSP+DAdvect.FISH;
  DAdvectBulk.SOIL = 0;
  DAdvectBulk.SEDIMENT = DAdvect.SEDIMENT;

  const EquivFlow = {}, HTimeH = {};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{
    EquivFlow[m]={}; HTimeH[m]={};
    [AIR,WATER,SOIL,SEDIMENT].forEach(ms=>{
      const dval=(DVal[m]&&DVal[m][ms])||0;
      EquivFlow[m][ms]=dval/zBulk[m];
      if(EquivFlow[m][ms]!==0) HTimeH[m][ms]=LN2*VolumeBulk[m]/EquivFlow[m][ms];
    });
  });

  const noWater = Area.WATER===0;
  const Fugacity = {};
  const DTotal = {};
  if(noWater){
    DTotal[1]=DReactBulk.AIR+DAdvectBulk.AIR+(DVal.AIR.WATER||0)+(DVal.AIR.SOIL||0);
    DTotal[3]=DReactBulk.SOIL+DAdvectBulk.SOIL+(DVal.SOIL.AIR||0)+(DVal.SOIL.WATER||0);
    const jTemp={};
    jTemp[1]=(EmissRateM.AIR+InflowRateM.AIR)/DTotal[1]+EmissRateM.SOIL*DVal.SOIL.AIR/(DTotal[3]*DTotal[1]);
    jTemp[2]=DVal.WATER.AIR/DTotal[1];
    jTemp[3]=1-DVal.SOIL.AIR*DVal.AIR.SOIL/(DTotal[1]*DTotal[3]);
    Fugacity.WATER=0;
    Fugacity.AIR=(jTemp[1]+Fugacity.WATER*jTemp[2])/jTemp[3];
    Fugacity.SOIL=(EmissRateM.SOIL+Fugacity.AIR*DVal.AIR.SOIL)/DTotal[3];
    Fugacity.SEDIMENT=0;
  } else {
    DTotal[1]=DReactBulk.AIR+DAdvectBulk.AIR+DVal.AIR.WATER+DVal.AIR.SOIL;
    DTotal[2]=DReactBulk.WATER+DAdvectBulk.WATER+DVal.WATER.AIR+DVal.WATER.SOIL+DVal.WATER.SEDIMENT;
    DTotal[3]=DReactBulk.SOIL+DAdvectBulk.SOIL+DVal.SOIL.AIR+DVal.SOIL.WATER;
    DTotal[4]=DReactBulk.SEDIMENT+DAdvectBulk.SEDIMENT+DVal.SEDIMENT.WATER;
    const jTemp={};
    jTemp[1]=(EmissRateM.AIR+InflowRateM.AIR)/DTotal[1]+EmissRateM.SOIL*DVal.SOIL.AIR/(DTotal[3]*DTotal[1]);
    jTemp[2]=DVal.WATER.AIR/DTotal[1];
    jTemp[3]=1-DVal.SOIL.AIR*DVal.AIR.SOIL/(DTotal[1]*DTotal[3]);
    jTemp[4]=DVal.AIR.WATER+DVal.SOIL.WATER*DVal.AIR.SOIL/DTotal[3];
    Fugacity.WATER=((EmissRateM.WATER+InflowRateM.WATER)+jTemp[1]*jTemp[4]/jTemp[3]+EmissRateM.SOIL*DVal.SOIL.WATER/DTotal[3]+EmissRateM.SEDIMENT*DVal.SEDIMENT.WATER/DTotal[4])
      /(DTotal[2]-jTemp[2]*jTemp[4]/jTemp[3]-DVal.WATER.SEDIMENT*DVal.SEDIMENT.WATER/DTotal[4]);
    Fugacity.AIR=(jTemp[1]+Fugacity.WATER*jTemp[2])/jTemp[3];
    Fugacity.SOIL=(EmissRateM.SOIL+Fugacity.AIR*DVal.AIR.SOIL)/DTotal[3];
    Fugacity.SEDIMENT=(EmissRateM.SEDIMENT+Fugacity.WATER*DVal.WATER.SEDIMENT)/DTotal[4];
  }

  const TransRateM={}, TransRateK={};
  function setTR(from,to){
    const d=(DVal[from]&&DVal[from][to])||0;
    TransRateM[from+'_'+to]=d*Fugacity[from];
    TransRateK[from+'_'+to]=TransRateM[from+'_'+to]*chem.molWgt/1000;
  }
  ['AIR_WATER','AIR_SOIL','WATER_AIR','WATER_SEDIMENT','SOIL_AIR','SOIL_WATER','SEDIMENT_WATER'].forEach(k=>{
    const [f,t]=k.split('_'); setTR(f,t);
  });

  let ChemAmtM=0;
  const ConcMolBulk={}, AmtMolBulk={}, AmtKgBulk={}, ConcGmBulk={}, ConcMicroBulk={};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{
    ConcMolBulk[m]=Fugacity[m]*zBulk[m];
    AmtMolBulk[m]=ConcMolBulk[m]*VolumeBulk[m];
    AmtKgBulk[m]=AmtMolBulk[m]*chem.molWgt/1000;
    ConcGmBulk[m]=ConcMolBulk[m]*chem.molWgt;
    ConcMicroBulk[m]=ConcGmBulk[m]*1000/DensityBulk[m];
    ChemAmtM+=AmtMolBulk[m];
  });
  const ChemAmtK = ChemAmtM*chem.molWgt/1000;

  // subcompartment amounts/concentrations
  const FugacitySub = {AIR:{VAPOUR:Fugacity.AIR,SOLID:Fugacity.AIR},
                        WATER:{LIQUID:Fugacity.WATER,SOLID:Fugacity.WATER,BIOTA:Fugacity.WATER},
                        SOIL:{VAPOUR:Fugacity.SOIL,LIQUID:Fugacity.SOIL,SOLID:Fugacity.SOIL},
                        SEDIMENT:{LIQUID:Fugacity.SEDIMENT,SOLID:Fugacity.SEDIMENT}};
  const ConcMolSub={}, AmtMolSub={}, AmtKgSub={}, ConcGmSub={}, ConcMicroSub={};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{
    ConcMolSub[m]={};AmtMolSub[m]={};AmtKgSub[m]={};ConcGmSub[m]={};ConcMicroSub[m]={};
    Object.keys(zSub[m]).forEach(sub=>{
      const dens = DensitySub[m][sub];
      if(dens){
        ConcMolSub[m][sub]=FugacitySub[m][sub]*zSub[m][sub];
        AmtMolSub[m][sub]=ConcMolSub[m][sub]*VolumeSub[m][sub];
        AmtKgSub[m][sub]=AmtMolSub[m][sub]*chem.molWgt/1000;
        ConcGmSub[m][sub]=ConcMolSub[m][sub]*chem.molWgt;
        ConcMicroSub[m][sub]=ConcGmSub[m][sub]*1000/dens;
      }
    });
  });

  let OutLossReactM=0, OutLossAdvectM=0;
  const LossReactBulkM={},LossAdvectBulkM={},LossReactBulkK={},LossAdvectBulkK={};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{
    LossReactBulkM[m]=Fugacity[m]*DReactBulk[m];
    LossAdvectBulkM[m]=Fugacity[m]*DAdvectBulk[m];
    LossReactBulkK[m]=LossReactBulkM[m]*chem.molWgt/1000;
    LossAdvectBulkK[m]=LossAdvectBulkM[m]*chem.molWgt/1000;
    OutLossReactM+=LossReactBulkM[m];
    OutLossAdvectM+=LossAdvectBulkM[m];
  });
  const OutLossReactK=OutLossReactM*chem.molWgt/1000;
  const OutLossAdvectK=OutLossAdvectM*chem.molWgt/1000;
  const OutLossTotalM=OutLossReactM+OutLossAdvectM;
  const OutLossTotalK=OutLossTotalM*chem.molWgt/1000;

  // subcompartment losses (for reaction/advection tabs)
  const fugFor = (m)=>Fugacity[m];
  const LossReactM = {
    AIR: Fugacity.AIR*DReact.AIR, WATER: Fugacity.WATER*DReact.WATER, SOIL: Fugacity.SOIL*DReact.SOIL,
    SEDIMENT: Fugacity.SEDIMENT*DReact.SEDIMENT, SUSP: Fugacity.WATER*DReact.SUSP, FISH: Fugacity.WATER*DReact.FISH,
    AEROSOL: Fugacity.AIR*DReact.AEROSOL
  };
  const LossAdvectM = {
    AIR: Fugacity.AIR*DAdvect.AIR, WATER: Fugacity.WATER*DAdvect.WATER, SOIL: Fugacity.SOIL*DAdvect.SOIL,
    SEDIMENT: Fugacity.SEDIMENT*DAdvect.SEDIMENT, SUSP: Fugacity.WATER*DAdvect.SUSP, FISH: Fugacity.WATER*DAdvect.FISH,
    AEROSOL: Fugacity.AIR*DAdvect.AEROSOL
  };
  const LossReactK={}, LossAdvectK={};
  [AIR,WATER,SOIL,SEDIMENT,SUSP,FISH,AEROSOL].forEach(m=>{
    LossReactK[m]=LossReactM[m]*chem.molWgt/1000;
    LossAdvectK[m]=LossAdvectM[m]*chem.molWgt/1000;
  });

  const TimeResReactH = ChemAmtM/(OutLossReactM+1e-11);
  const TimeResAdvectH = ChemAmtM/(OutLossAdvectM+1e-11);
  const TimeResTotalH = ChemAmtM/(OutLossTotalM+1e-11);

  const VxZBulk={}; let VxZBulkTotal=0;
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=>{VxZBulk[m]=VolumeBulk[m]*zBulk[m]; VxZBulkTotal+=VxZBulk[m];});

  const PercentBulk={};
  [AIR,WATER,SOIL,SEDIMENT].forEach(m=> PercentBulk[m] = ChemAmtM===0?0:100*AmtMolBulk[m]/ChemAmtM);

  return {
    TempK, Area, Depth, VolumeBulk, VolumeFract, VolumeSub, zSub, zBulk, DensitySub, DensityBulk,
    ResTimeH, AdvFlowRate, AdvFlowRateBulk,
    EmissRateK, EmissRateM, TotalEmissRateM, TotalEmissRateK,
    AdvInflowConcNG, InflowRateM, InflowRateK, TotChemInputM, TotChemInputK,
    DVal, DReact, DAdvect, DReactBulk, DAdvectBulk, EquivFlow, HTimeH,
    Fugacity, FugacitySub, TransRateM, TransRateK,
    ChemAmtM, ChemAmtK, AmtMolBulk, AmtKgBulk, ConcMolBulk, ConcGmBulk, ConcMicroBulk, PercentBulk,
    AmtMolSub, AmtKgSub, ConcMolSub, ConcGmSub, ConcMicroSub,
    OutLossReactM, OutLossAdvectM, OutLossTotalM, OutLossReactK, OutLossAdvectK, OutLossTotalK,
    LossReactBulkK, LossAdvectBulkK, LossReactK, LossAdvectK,
    TimeResReactH, TimeResAdvectH, TimeResTotalH, VxZBulk, VxZBulkTotal, noWater, ProcessD
  };
}

let state = {
  step: 'id',

  environment: null, environmentDraft: null, environmentBaseIndex: -1,
  emissions: {...DEFAULT_EMISSIONS},

  geminiKey: '', geminiModel: 'gemini-2.5-flash',
  aiLoading: false, aiExplanation: null, aiChatLog: [], aiQuestionDraft: '',
};

function maxStepIndex(){
  let idx = 0;
  if(state.simId.trim().length>0) idx = 1;
  if(idx>=1 && state.chemical) idx = 2;
  if(idx>=2 && state.environment) idx = 3;
  if(idx>=3 && state.results) idx = 4;
  return idx;
}
function canGoTo(step){
  const target = STEP_ORDER.indexOf(step);
  return target <= maxStepIndex();
}
function goTo(step){ if(canGoTo(step)){ state.step = step; render(); window.scrollTo({top:0,behavior:'smooth'}); } }

function showToast(msg){
  state.toast = msg; render();
  setTimeout(()=>{ state.toast=null; render(); }, 2200);
}

/* ---- persistence (localStorage — works in any browser, no platform needed) ---- */
const LS_PREFIX = 'level3fm_';
function lsGet(key, fallback){
  try{
    const v = localStorage.getItem(LS_PREFIX+key);
    return v===null ? fallback : v;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){ console.error('localStorage write failed', e); }
}

async function loadPersisted(){
  try{ state.customChemicals = JSON.parse(lsGet('custom_chemicals','[]')); }catch(e){ state.customChemicals = []; }
  try{ state.customEnvironments = JSON.parse(lsGet('custom_environments','[]')); }catch(e){ state.customEnvironments = []; }
  try{ state.savedSimulations = JSON.parse(lsGet('saved_simulations','[]')); }catch(e){ state.savedSimulations = []; }
  state.geminiKey = lsGet('gemini_api_key', '');
  state.geminiModel = lsGet('gemini_model', 'gemini-2.5-flash');
  applyTheme(state.theme);
  render();
}

function persistChemicals(){ lsSet('custom_chemicals', JSON.stringify(state.customChemicals)); }
function persistEnvironments(){ lsSet('custom_environments', JSON.stringify(state.customEnvironments)); }
function persistSimulations(){ lsSet('saved_simulations', JSON.stringify(state.savedSimulations)); }
function persistGeminiKey(){ lsSet('gemini_api_key', state.geminiKey||''); }
function persistGeminiModel(){ lsSet('gemini_model', state.geminiModel||'gemini-2.5-flash'); }

/* =========================================================================
   FORMATTERS
   ========================================================================= */
function fmt(n, sig=3){
  if(n===undefined||n===null||isNaN(n)) return '—';
  if(n===0) return '0';
  const abs = Math.abs(n);
  if(abs!==0 && (abs<0.001 || abs>=100000)) return n.toExponential(sig-1).replace('e+','E+').replace('e-','E-');
  return Number(n.toPrecision(sig)).toString();
}
function fmtPct(n){ if(n===undefined||n===null||isNaN(n)) return '—'; return (Math.abs(n)<0.001&&n!==0? n.toExponential(2): Number(n.toPrecision(3))) + '%'; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    ${state.showAISettings ? renderAISettingsScreen() : `
      ${renderStepper()}
      <div>${renderStep()}</div>
    `}
    ${state.toast? `<div class="toast">${esc(state.toast)}</div>`:''}
  `;
  attachHandlers();
}

function renderTopbar(){
  return `
  <div class="topbar no-print">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>${esc(state.copy.brandTitle)}</h1>
        <p>${esc(state.copy.brandSubtitle)}</p>
      </div>
    </div>
    <div class="topbar-actions">
      ${state.results? `<button class="btn btn-sm" onclick="window.print()">${esc(state.copy.printBtn)}</button>`:''}
      <button class="btn btn-sm btn-ghost" onclick="openAISettings()">🔑 AI Settings</button>
      <button class="btn btn-sm btn-ghost" onclick="resetAll()">${esc(state.copy.newSimBtn)}</button>
    </div>
  </div>`;
}

function renderStepper(){
  return `<div class="stepper no-print">
    ${STEP_ORDER.map((s,i)=>{
      const idx = maxStepIndex();
      const done = i < idx || (state.step===s && i<=idx);
      const active = state.step===s;
      const reachable = canGoTo(s);
      return `<div class="step-pill ${active?'active':''} ${done&&!active?'done':''} ${reachable?'clickable':''}" ${reachable?`onclick="goTo('${s}')"`:''}>
        <span class="num">${i+1}</span> ${esc(state.copy['stepLabel_'+s])}
      </div>`;
    }).join('')}
  </div>`;
}

function renderStep(){
  switch(state.step){
    case 'id': return renderStepId();
    case 'chemical': return renderStepChemical();
    case 'environment': return renderStepEnvironment();
    case 'emissions': return renderStepEmissions();
    case 'results': return renderStepResults();
  }
}

/* ---------- STEP 3: Environment ---------- */

  const C = state.copy;

  const draft = state.environmentDraft || (state.environmentDraft = newEnvironmentDraft());
  const baseIdx = state.environmentBaseIndex !== undefined ? state.environmentBaseIndex : -1;
  return `
  <div class="card">
    <h2>${esc(C.step3Title)}</h2>

      <label>${esc(C.step3StartFromLabel)}</label>
      <select id="env-base-select" class="select-native" onchange="loadEnvironmentBase(this.value)">
        <option value="-1" ${baseIdx===-1?'selected':''}>${esc(C.step3NewOption)}</option>

function newEnvironmentDraft(){

    volFracAirAerosol:2e-11, volFracWaterSusp:5e-6, volFracWaterFish:1e-6, volFracSoilAir:0.2, volFracSoilWater:0.3, volFracSoilSolid:0.5,
    volFracSedimentWater:0.8, volFracSedimentSolid:0.2, densAirAerosol:2000, densWaterSusp:1500, densWaterFish:1000,
    densSoilSolid:2400, densSedimentSolid:2400, orgCarbSoil:0.02, orgCarbSediment:0.04, orgCarbSusp:0.2, lipidFish:0.05,
    resTimeAir:100, resTimeWater:1000, resTimeSediment:50000,
    transVel:{1:5,2:0.05,3:0.0001,4:10,5:0.02,6:0.00001,7:5,8:0.0001,9:5e-7,10:2e-7,11:5e-5,12:1e-8}, scavenging:200000};
}

/* ---------- STEP 5: Results ---------- */
function renderStepResults(){
  if(!state.results) return `<div class="empty-note">No results yet — complete the previous steps and click Compute.</div>`;
  const R = state.results;
  const C = state.copy;
  const tabs = [
    ['chem','Chemical'],['env','Environment'],['mass','Mass Balance'],['fugacity','Fugacity'],
    ['phase','Phase Properties'],['advection','Advection'],['reaction','Reaction'],
    ['intermedia','Intermedia Transport'],['process','Process D Values'],['diagram','Diagram'],['charts','Charts'],
    ['ai','✨ AI Insights']
  ];
  return `
  <div class="card">
    <div class="row-between" style="margin-top:0;">
      <div>
        <h2 style="margin-bottom:2px;">${esc(state.simId)}</h2>
        <p class="sub" style="margin:0;">${esc(state.chemical.name)} in ${esc(state.environment.name)}${state.simComment? ' — '+esc(state.simComment):''}</p>
      </div>
      <button class="btn btn-primary btn-sm no-print" onclick="saveSimulation()">${esc(C.resultsSaveBtn)}</button>
    </div>

    <div class="results-tabs no-print">
      ${tabs.map(([k,label])=>`<button class="rtab ${state.resultsTab===k?'active':''}" onclick="setResultsTab('${k}')">${label}</button>`).join('')}
    </div>

    ${renderResultsTab(state.resultsTab, R)}

    <div class="row-between no-print">
      <button class="btn btn-ghost" onclick="goTo('emissions')">${esc(C.resultsBackBtn)}</button>
      <button class="btn" onclick="window.print()">${esc(state.copy.resultsPrintBtn)}</button>
    </div>
  </div>`;
}

function renderResultsTab(tab, R){
  switch(tab){
    case 'chem': return renderChemTab();
    case 'env': return renderEnvTab();
    case 'mass': return renderMassBalanceTab(R);
    case 'fugacity': return renderFugacityTab(R);
    case 'phase': return renderPhaseTab(R);
    case 'advection': return renderAdvectionTab(R);
    case 'reaction': return renderReactionTab(R);
    case 'intermedia': return renderIntermediaTab(R);
    case 'process': return renderProcessTab(R);
    case 'diagram': return renderDiagramTab(R);
    case 'charts': return renderChartsTab(R);
    case 'ai': return renderAIInsightsTab(R);
    default: return '';
  }
}

  if(c.type===1){
    extra = `<div class="table-wrap"><table class="data-table"><tbody>
      <tr><td>Water solubility</td><td>${fmt(c.watSol)} g/m³</td></tr>

/* ---- SVG chart builders — styled to match the Level III "Charts" dialog ---- */
function niceMax(v){
  if(v<=0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v/mag;
  let step;
  if(norm<=1) step=1; else if(norm<=2) step=2; else if(norm<=5) step=5; else step=10;
  return step*mag;
}

function buildBarChartPDF(labels, values){
  const W=520,H=340,padL=56,padR=56,padT=20,padB=40;
  const maxV = niceMax(Math.max(...values.map(v=>Math.abs(v)||0), 1e-30));
  const divisions = 8;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const gridlines = [];
  for(let i=0;i<=divisions;i++){
    const val = maxV*i/divisions;
    const y = H-padB-(val/maxV)*plotH;
    gridlines.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--mono)">${fmt(val,3)}</text>
      <text x="${W-padR+8}" y="${(y+3).toFixed(1)}" text-anchor="start" font-size="9.5" fill="var(--muted)" font-family="var(--mono)">${fmt(val,3)}</text>`);
  }
  const bw = plotW/labels.length;
  const bars = labels.map((lab,i)=>{
    const v = values[i]||0;
    const h = maxV>0 ? (v/maxV)*plotH : 0;
    const x = padL + i*bw + bw*0.22;
    const y = H-padB-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.56).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="#D6473F"/>
      <text x="${(x+bw*0.28).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" font-size="11" fill="var(--text)" font-family="var(--mono)">${lab}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:560px;display:block;margin:0 auto;">
    <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="none" stroke="var(--line)" stroke-width="1"/>
    ${gridlines.join('')}
    ${bars}
  </svg>`;
}

function buildPieChartPDF(labels, values){
  const colors = ['#D6473F','#3FA85C','#3F7FD6','#D6C23F'];
  const total = values.reduce((a,b)=>a+(b||0),0) || 1;
  const cx=140,cy=140,r=110;
  let angle=-90;
  const slices = labels.map((lab,i)=>{
    const v = values[i]||0;
    const frac = v/total;
    const sweep = frac*360;
    const x1 = cx + r*Math.cos(angle*Math.PI/180);
    const y1 = cy + r*Math.sin(angle*Math.PI/180);
    const endAngle = angle+sweep;
    const x2 = cx + r*Math.cos(endAngle*Math.PI/180);
    const y2 = cy + r*Math.sin(endAngle*Math.PI/180);
    const largeArc = sweep>180?1:0;
    const path = sweep>=359.999
      ? `M${cx},${cy-r} A${r},${r} 0 1 1 ${cx-0.01},${cy-r} Z`
      : `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    angle = endAngle;
    return `<path d="${path}" fill="${colors[i]}" stroke="var(--panel-2)" stroke-width="2"/>`;
  }).join('');
  const legend = labels.map((lab,i)=>`<div class="pie-legend-item"><span class="leg-swatch" style="background:${colors[i]}"></span>${lab}</div>`).join('');
  return `<div class="pie-wrap">
    <svg viewBox="0 0 280 280" width="100%" style="max-width:300px;display:block;">${slices}</svg>
    <div class="pie-legend">${legend}</div>
  </div>`;
}

function cloudPath(x,y,w,h){
  // stylized cloud silhouette scaled to a w x h bounding box, anchored at (x,y) top-left
  const sx=w/240, sy=h/130;
  const pts = [
    [30,90],[10,90],[6,68],[22,55],[18,35],[42,20],[68,28],
    [82,10],[118,8],[138,26],[168,18],[190,38],[186,58],
    [206,64],[210,86],[190,100],[60,100],[36,100]
  ];
  let d = `M${(x+pts[0][0]*sx).toFixed(1)},${(y+pts[0][1]*sy).toFixed(1)} `;
  d += `C${(x+10*sx).toFixed(1)},${(y+90*sy).toFixed(1)} ${(x+0*sx).toFixed(1)},${(y+70*sy).toFixed(1)} ${(x+22*sx).toFixed(1)},${(y+55*sy).toFixed(1)} `;
  d += `C${(x+10*sx).toFixed(1)},${(y+38*sy).toFixed(1)} ${(x+28*sx).toFixed(1)},${(y+18*sy).toFixed(1)} ${(x+42*sx).toFixed(1)},${(y+20*sy).toFixed(1)} `;
  d += `C${(x+50*sx).toFixed(1)},${(y+2*sy).toFixed(1)} ${(x+78*sx).toFixed(1)},${(y-2*sy).toFixed(1)} ${(x+90*sx).toFixed(1)},${(y+12*sy).toFixed(1)} `;
  d += `C${(x+104*sx).toFixed(1)},${(y-2*sy).toFixed(1)} ${(x+140*sx).toFixed(1)},${(y-2*sy).toFixed(1)} ${(x+150*sx).toFixed(1)},${(y+16*sy).toFixed(1)} `;
  d += `C${(x+172*sx).toFixed(1)},${(y+8*sy).toFixed(1)} ${(x+198*sx).toFixed(1)},${(y+20*sy).toFixed(1)} ${(x+196*sx).toFixed(1)},${(y+42*sy).toFixed(1)} `;
  d += `C${(x+218*sx).toFixed(1)},${(y+44*sy).toFixed(1)} ${(x+228*sx).toFixed(1)},${(y+64*sy).toFixed(1)} ${(x+214*sx).toFixed(1)},${(y+78*sy).toFixed(1)} `;
  d += `C${(x+226*sx).toFixed(1)},${(y+92*sy).toFixed(1)} ${(x+210*sx).toFixed(1)},${(y+108*sy).toFixed(1)} ${(x+192*sx).toFixed(1)},${(y+104*sy).toFixed(1)} `;
  d += `L${(x+40*sx).toFixed(1)},${(y+104*sy).toFixed(1)} `;
  d += `C${(x+16*sx).toFixed(1)},${(y+108*sy).toFixed(1)} ${(x+4*sx).toFixed(1)},${(y+96*sy).toFixed(1)} ${(x+18*sx).toFixed(1)},${(y+82*sy).toFixed(1)} Z`;
  return d;
}

function buildDiagramSVG(R){
  const em = state.emissions;
  const W=880,H=680;
  const COL = {air:'#2E86C9', water:'#1F5C99', soil:'#9C6A2E', sediment:'#6E5686',
               emission:'#6B7A8C', reaction:'#B0752E', advection:'#3D4A5C', intermedia:'#0E9C89'};

  // Compartment boxes
  const AIR_X=300, AIR_Y=20, AIR_W=280, AIR_H=130;
  const SOIL_X=40, SOIL_Y=250, SOIL_W=220, SOIL_H=130;
  const WATER_X=330, WATER_Y=250, WATER_W=270, WATER_H=130;
  const SED_X=330, SED_Y=450, SED_W=270, SED_H=130;

  function airBox(){
    const cx=AIR_X, cy=AIR_Y;
    return `<g>
      <path d="${cloudPath(cx,cy,AIR_W,AIR_H)}" fill="var(--panel-2)" stroke="${COL.air}" stroke-width="1.8"/>
      <text x="${cx+AIR_W/2}" y="${cy+40}" text-anchor="middle" font-size="14" font-weight="700" fill="${COL.air}" font-family="var(--serif-display)">AIR</text>
      <text x="${cx+AIR_W/2}" y="${cy+58}" text-anchor="middle" font-size="10.5" fill="var(--text)" font-family="var(--mono)">${fmt(R.AmtKgBulk.AIR)} kg (${fmtPct(R.PercentBulk.AIR)})</text>
      <text x="${cx+AIR_W/2}" y="${cy+74}" text-anchor="middle" font-size="10.5" fill="var(--text)" font-family="var(--mono)">Fug = ${fmt(R.Fugacity.AIR*1e6,3)} µPa</text>
      <text x="${cx+AIR_W/2}" y="${cy+90}" text-anchor="middle" font-size="10.5" fill="var(--text)" font-family="var(--mono)">Conc = ${fmt(R.ConcGmBulk.AIR*1e9,3)} ng/m³</text>
    </g>`;
  }
  function box(x,y,w,h,color,title,lines){
    return `<g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--panel-2)" stroke="${color}" stroke-width="1.8"/>
      <text x="${x+w/2}" y="${y+26}" text-anchor="middle" font-size="14" font-weight="700" fill="${color}" font-family="var(--serif-display)">${title}</text>
      ${lines.map((l,i)=>`<text x="${x+w/2}" y="${y+46+i*16}" text-anchor="middle" font-size="10.5" fill="var(--text)" font-family="var(--mono)">${l}</text>`).join('')}
    </g>`;
  }

  const soilLines = [`${fmt(R.AmtKgBulk.SOIL)} kg (${fmtPct(R.PercentBulk.SOIL)})`, `Fug = ${fmt(R.Fugacity.SOIL*1e6,3)} µPa`, `Conc = ${fmt(R.ConcMicroBulk.SOIL,3)} µg/g solids`];
  const waterLines = [`${fmt(R.AmtKgBulk.WATER)} kg (${fmtPct(R.PercentBulk.WATER)})`, `Fug = ${fmt(R.Fugacity.WATER*1e6,3)} µPa`, `Conc = ${fmt(R.ConcGmBulk.WATER*1e6,3)} ng/L`];
  const sedLines = [`${fmt(R.AmtKgBulk.SEDIMENT)} kg (${fmtPct(R.PercentBulk.SEDIMENT)})`, `Fug = ${fmt(R.Fugacity.SEDIMENT*1e6,3)} µPa`, `Conc = ${fmt(R.ConcMicroBulk.SEDIMENT,3)} µg/g solids`];

  function straightArrow(x1,y1,x2,y2,color,dash){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" ${dash?'stroke-dasharray="2,3"':''} marker-end="url(#arrow-${color.replace('#','')})"/>`;
  }
  function labelAt(x,y,text,color,anchor){
    return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-size="10" fill="${color}" font-family="var(--mono)">${text}</text>`;
  }

  const markerColors = [COL.air,COL.water,COL.soil,COL.sediment,COL.emission,COL.reaction,COL.advection,COL.intermedia,'var(--muted)'];
  const markers = markerColors.map(col=>`
    <marker id="arrow-${col.replace('#','').replace(/[^a-zA-Z0-9]/g,'')}" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="${col}"/>
    </marker>`).join('');

  // Emission arrows (light gray-blue, "Emission" legend style) — into each compartment from above/left
  const emissionArrows = `
    <line x1="380" y1="-30" x2="380" y2="20" stroke="${COL.emission}" stroke-width="5" marker-end="url(#arrow-${COL.emission.replace('#','')})"/>
    ${labelAt(390,-8,fmt(em.air)+' kg/h',COL.emission,'start')}
    <line x1="130" y1="220" x2="130" y2="250" stroke="${COL.emission}" stroke-width="5" marker-end="url(#arrow-${COL.emission.replace('#','')})"/>
    ${labelAt(140,236,fmt(em.soil)+' kg/h',COL.emission,'start')}
    <line x1="420" y1="220" x2="420" y2="250" stroke="${COL.emission}" stroke-width="5" marker-end="url(#arrow-${COL.emission.replace('#','')})"/>
    ${labelAt(430,236,fmt(em.water)+' kg/h',COL.emission,'start')}
    <line x1="490" y1="420" x2="490" y2="450" stroke="${COL.emission}" stroke-width="5" marker-end="url(#arrow-${COL.emission.replace('#','')})"/>
    ${labelAt(500,436,fmt(em.sediment)+' kg/h',COL.emission,'start')}
  `;

  // Reaction (loss) arrows — dashed, out to the left/bottom of each compartment
  const reactionArrows = `
    ${straightArrow(300,60,255,60,COL.reaction,true)} ${labelAt(250,56,fmt(R.LossReactBulkK.AIR)+' kg/h (rxn)',COL.reaction,'end')}
    ${straightArrow(150,380,150,415,COL.reaction,true)} ${labelAt(158,405,fmt(R.LossReactBulkK.SOIL)+' kg/h (rxn)',COL.reaction,'start')}
    ${straightArrow(600,300,645,300,COL.reaction,true)} ${labelAt(651,304,fmt(R.LossReactBulkK.WATER)+' kg/h (rxn)',COL.reaction,'start')}
    ${straightArrow(600,500,645,500,COL.reaction,true)} ${labelAt(651,504,fmt(R.LossReactBulkK.SEDIMENT)+' kg/h (rxn)',COL.reaction,'start')}
  `;

  // Advection (loss) arrows — solid pale, out to the right of Air/Water/Sediment
  const advectionArrows = `
    ${straightArrow(580,80,645,80,COL.advection,false)} ${labelAt(651,84,fmt(R.LossAdvectBulkK.AIR)+' kg/h (adv)',COL.advection,'start')}
    ${straightArrow(600,330,645,330,COL.advection,false)} ${labelAt(651,334,fmt(R.LossAdvectBulkK.WATER)+' kg/h (adv)',COL.advection,'start')}
    ${straightArrow(600,530,645,530,COL.advection,false)} ${labelAt(651,534,fmt(R.LossAdvectBulkK.SEDIMENT)+' kg/h (adv)',COL.advection,'start')}
  `;

  // Intermedia exchange — teal double arrows between adjacent compartments
  const intermedia = `
    ${straightArrow(360,150,360,250,COL.intermedia,false)} ${labelAt(330,205,'Air→Water',COL.intermedia,'end')} ${labelAt(330,218,fmt(R.TransRateK.AIR_WATER)+' kg/h',COL.intermedia,'end')}
    ${straightArrow(410,250,410,150,COL.intermedia,false)} ${labelAt(440,205,'Water→Air',COL.intermedia,'start')} ${labelAt(440,218,fmt(R.TransRateK.WATER_AIR)+' kg/h',COL.intermedia,'start')}

    ${straightArrow(300,90,220,250,COL.intermedia,false)} ${labelAt(215,160,'Air→Soil',COL.intermedia,'end')} ${labelAt(215,173,fmt(R.TransRateK.AIR_SOIL)+' kg/h',COL.intermedia,'end')}
    ${straightArrow(220,250,300,110,COL.intermedia,false)} ${labelAt(285,175,'Soil→Air',COL.intermedia,'start')} ${labelAt(285,188,fmt(R.TransRateK.SOIL_AIR)+' kg/h',COL.intermedia,'start')}

    ${straightArrow(260,300,330,300,COL.intermedia,false)} ${labelAt(295,290,'Soil→Water',COL.intermedia,'middle')} ${labelAt(295,320,fmt(R.TransRateK.SOIL_WATER)+' kg/h',COL.intermedia,'middle')}

    ${straightArrow(400,380,400,450,COL.intermedia,false)} ${labelAt(365,415,'Water→Sed.',COL.intermedia,'end')} ${labelAt(365,428,fmt(R.TransRateK.WATER_SEDIMENT)+' kg/h',COL.intermedia,'end')}
    ${straightArrow(450,450,450,380,COL.intermedia,false)} ${labelAt(475,415,'Sed.→Water',COL.intermedia,'start')} ${labelAt(475,428,fmt(R.TransRateK.SEDIMENT_WATER)+' kg/h',COL.intermedia,'start')}
  `;

  const legend = `
    <g font-family="var(--mono)" font-size="10.5">
      <text x="40" y="612" font-weight="700" fill="var(--text)" font-size="12">Legend</text>
      <line x1="40" y1="626" x2="70" y2="626" stroke="${COL.emission}" stroke-width="5" marker-end="url(#arrow-${COL.emission.replace('#','')})"/>
      <text x="78" y="630" fill="var(--muted)">Emission</text>
      <line x1="180" y1="626" x2="210" y2="626" stroke="${COL.reaction}" stroke-width="3" stroke-dasharray="2,3" marker-end="url(#arrow-${COL.reaction.replace('#','')})"/>
      <text x="218" y="630" fill="var(--muted)">Reaction</text>
      <line x1="320" y1="626" x2="350" y2="626" stroke="${COL.advection}" stroke-width="3" marker-end="url(#arrow-${COL.advection.replace('#','')})"/>
      <text x="358" y="630" fill="var(--muted)">Advection</text>
      <line x1="470" y1="626" x2="500" y2="626" stroke="${COL.intermedia}" stroke-width="3" marker-end="url(#arrow-${COL.intermedia.replace('#','')})"/>
      <text x="508" y="630" fill="var(--muted)">Intermedia exchange</text>
    </g>`;

  const summary = `
    <g font-family="var(--mono)" font-size="11">
      <text x="40" y="655" fill="var(--accent)" font-weight="600">Residence time — total: ${fmt(R.TimeResTotalH)} h (${fmt(R.TimeResTotalH/24)} d) · reaction: ${fmt(R.TimeResReactH)} h · advection: ${fmt(R.TimeResAdvectH)} h</text>
      <text x="40" y="672" fill="var(--muted)">Total emissions: ${fmt(R.TotChemInputK)} kg/h · Total mass in system: ${fmt(R.ChemAmtK)} kg</text>
    </g>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:760px;">
    <defs>${markers}</defs>
    ${airBox()}
    ${box(SOIL_X,SOIL_Y,SOIL_W,SOIL_H,COL.soil,'SOIL',soilLines)}
    ${box(WATER_X,WATER_Y,WATER_W,WATER_H,COL.water,'WATER',waterLines)}
    ${box(SED_X,SED_Y,SED_W,SED_H,COL.sediment,'SEDIMENT',sedLines)}
    ${intermedia}
    ${emissionArrows}
    ${reactionArrows}
    ${advectionArrows}
    ${legend}
    ${summary}
  </svg>`;
}

async function saveGeminiSettings(){
  persistGeminiKey();
  persistGeminiModel();
  showToast('Gemini settings saved.');

  state.geminiKey = '';
  persistGeminiKey();

}

async function callGemini(prompt){
  if(!state.geminiKey){
    showToast('Add your Gemini API key in AI Settings first.');
    return null;
  }
  const model = state.geminiModel || 'gemini-2.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(state.geminiKey)}`;
  try{
    const resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    const data = await resp.json();
    if(!resp.ok || data.error){
      throw new Error((data.error && data.error.message) || ('HTTP '+resp.status));
    }
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    const text = parts ? parts.map(p=>p.text||'').join('') : '';
    return text || '(Gemini returned an empty response.)';
  }catch(err){
    console.error('Gemini request failed', err);
    showToast('Gemini request failed: '+(err.message||'network error'));
    return null;
  }
}

function buildResultsPrompt(R, question){
  const c = state.chemical, e = state.environment, em = state.emissions;
  const summary = `You are helping a person interpret output from a Level III fugacity-based multimedia environmental fate model (a Mackay-type steady-state model of chemical distribution across air, water, soil, and sediment).

Simulation: ${state.simId || '(untitled)'}
Chemical: ${c.name} (Type ${c.type}, molar mass ${fmt(c.molWgt)} g/mol)
Environment: ${e.name}
Emission rates (kg/h): air ${fmt(em.air)}, water ${fmt(em.water)}, soil ${fmt(em.soil)}, sediment ${fmt(em.sediment)}

Key results:
- Fugacity (Pa): air ${fmt(R.Fugacity.AIR)}, water ${fmt(R.Fugacity.WATER)}, soil ${fmt(R.Fugacity.SOIL)}, sediment ${fmt(R.Fugacity.SEDIMENT)}
- Mass distribution: air ${fmtPct(R.PercentBulk.AIR)}, water ${fmtPct(R.PercentBulk.WATER)}, soil ${fmtPct(R.PercentBulk.SOIL)}, sediment ${fmtPct(R.PercentBulk.SEDIMENT)}
- Total mass in system: ${fmt(R.ChemAmtK)} kg
- Overall residence time: ${fmt(R.TimeResTotalH)} h (${fmt(R.TimeResTotalH/24)} d) — reaction ${fmt(R.TimeResReactH)} h, advection ${fmt(R.TimeResAdvectH)} h
- Loss pathway split: reaction ${fmt(R.OutLossReactK)} kg/h, advection ${fmt(R.OutLossAdvectK)} kg/h`;

  if(question){
    return summary + `\n\nThe person asks: "${question}"\n\nAnswer clearly and concisely, grounded in the numbers above. Keep it to a few short paragraphs.`;
  }
  return summary + `\n\nIn plain language (3–5 short paragraphs, minimal jargon), explain: which compartment(s) the chemical mainly ends up in and why, whether it behaves as persistent or short-lived here, and what that implies about its environmental fate.`;
}

async function explainResults(){
  if(state.aiLoading) return;
  if(!state.geminiKey){ showToast('Add your Gemini API key in AI Settings first.'); return; }
  state.aiLoading = true; render();
  const text = await callGemini(buildResultsPrompt(state.results));
  state.aiLoading = false;
  if(text) state.aiExplanation = text;
  render();
}

async function askAIQuestion(){
  const q = (state.aiQuestionDraft||'').trim();
  if(!q) return;
  if(!state.geminiKey){ showToast('Add your Gemini API key in AI Settings first.'); return; }
  state.aiChatLog.push({role:'user', text:q});
  state.aiQuestionDraft = '';
  state.aiLoading = true; render();
  const answer = await callGemini(buildResultsPrompt(state.results, q));
  state.aiLoading = false;
  if(answer) state.aiChatLog.push({role:'ai', text:answer});
  render();
}

function attachHandlers(){
  const simid = document.getElementById('f-simid');
  if(simid){
    simid.addEventListener('input', e=>{ state.simId = e.target.value; syncStepperOnly(); });
  }
  const simcomment = document.getElementById('f-simcomment');
  if(simcomment){ simcomment.addEventListener('input', e=>{ state.simComment = e.target.value; }); }
  const btnToChem = document.getElementById('btn-to-chemical');
  if(btnToChem){ btnToChem.addEventListener('click', ()=>{ if(state.simId.trim()){ state.step='chemical'; render(); window.scrollTo({top:0,behavior:'smooth'}); } }); }

  const btnToEnv = document.getElementById('btn-to-environment');
  if(btnToEnv){ btnToEnv.addEventListener('click', ()=>{ if(state.chemical){ state.step='environment'; render(); window.scrollTo({top:0,behavior:'smooth'}); } }); }

  const btnToEmis = document.getElementById('btn-to-emissions');
  if(btnToEmis){ btnToEmis.addEventListener('click', ()=>{ if(state.environment){ state.step='emissions'; render(); window.scrollTo({top:0,behavior:'smooth'}); } }); }

  bindEmissionsInputs();

  const btnCompute = document.getElementById('btn-compute');
  if(btnCompute){ btnCompute.addEventListener('click', doCompute); }
}

function syncStepperOnly(){
  // lightweight: just update stepper classes + continue button without full rerender (keeps focus in input)
  const idx = maxStepIndex();
  document.querySelectorAll('.step-pill').forEach((el,i)=>{
    el.classList.toggle('active', STEP_ORDER[i]===state.step);
    el.classList.toggle('done', i<idx && STEP_ORDER[i]!==state.step);
    const reachable = i<=idx;
    el.classList.toggle('clickable', reachable);
  });
  const btn = document.getElementById('btn-to-chemical');
  if(btn) btn.disabled = !state.simId.trim();
}

function bindEmissionsInputs(){
  const map = {'em-air':'air','em-water':'water','em-soil':'soil','em-sediment':'sediment','em-inair':'inflowAirNG','em-inwater':'inflowWaterNG'};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', e=>{ state.emissions[key] = parseFloat(e.target.value)||0; });
  });
}

function loadChemicalBase(indexStr){
  const idx = parseInt(indexStr,10);
  state.chemicalBaseIndex = isNaN(idx) ? -1 : idx;
  if(state.chemicalBaseIndex===-1){
    state.chemicalDraft = newChemicalDraft();
  } else {
    const allChems = [...CHEMICAL_PRESETS, ...state.customChemicals];
    const c = allChems[state.chemicalBaseIndex];
    state.chemicalDraft = c ? Object.assign(newChemicalDraft(), JSON.parse(JSON.stringify(c))) : newChemicalDraft();
  }
  render();
}
function loadEnvironmentBase(indexStr){
  const idx = parseInt(indexStr,10);
  state.environmentBaseIndex = isNaN(idx) ? -1 : idx;
  if(state.environmentBaseIndex===-1){
    state.environmentDraft = newEnvironmentDraft();
  } else {
    const allEnvs = [...ENV_PRESETS, ...state.customEnvironments];
    const e = allEnvs[state.environmentBaseIndex];
    state.environmentDraft = e ? Object.assign(newEnvironmentDraft(), JSON.parse(JSON.stringify(e))) : newEnvironmentDraft();
  }
  render();
}

function readChemicalFormIntoDraft(){
  const d = state.chemicalDraft;
  d.name = document.getElementById('cf-name').value.trim();
  d.type = parseInt(document.getElementById('cf-type').value,10);
  d.molWgt = parseFloat(document.getElementById('cf-molwgt').value)||0;
  d.dataTemp = parseFloat(document.getElementById('cf-datatemp').value)||25;
  if(d.type===1){
    d.watSol = parseFloat(document.getElementById('cf-watsol').value)||0;
    d.vapPress = parseFloat(document.getElementById('cf-vappress').value)||0;
    d.lKow = parseFloat(document.getElementById('cf-lkow').value)||0;
    d.meltPt = parseFloat(document.getElementById('cf-meltpt').value)||0;
  } else if(d.type===2){
    d.part1_2 = parseFloat(document.getElementById('cf-p12').value)||0;
    d.part3_2_D = parseFloat(document.getElementById('cf-p32d').value)||0;
    d.part4_2_D = parseFloat(document.getElementById('cf-p42d').value)||0;
    d.part5_2_D = parseFloat(document.getElementById('cf-p52d').value)||0;
    d.part6_2_D = parseFloat(document.getElementById('cf-p62d').value)||0;
    d.part7_2 = parseFloat(document.getElementById('cf-p72').value)||0;
  } else {
    d.part2_1 = parseFloat(document.getElementById('cf-p21').value)||0;
    d.part3_1 = parseFloat(document.getElementById('cf-p31').value)||0;
    d.part4_1 = parseFloat(document.getElementById('cf-p41').value)||0;
    d.part5_1 = parseFloat(document.getElementById('cf-p51').value)||0;
    d.part6_1 = parseFloat(document.getElementById('cf-p61').value)||0;
    d.part7_1 = parseFloat(document.getElementById('cf-p71').value)||0;
  }
  d.hLife = {
    AIR: parseFloat(document.getElementById('cf-hl-air').value)||1,
    WATER: parseFloat(document.getElementById('cf-hl-water').value)||1,
    SOIL: parseFloat(document.getElementById('cf-hl-soil').value)||1,
    SEDIMENT: parseFloat(document.getElementById('cf-hl-sediment').value)||1,
    SUSP: parseFloat(document.getElementById('cf-hl-susp').value)||1,
    FISH: parseFloat(document.getElementById('cf-hl-fish').value)||1,
    AEROSOL: parseFloat(document.getElementById('cf-hl-aerosol').value)||1,
  };
  const save = document.getElementById('cf-save').checked;
  return {d, save};
}

async function commitChemicalDraft(){
  const {d, save} = readChemicalFormIntoDraft();
  if(!d.name){ showToast('Please enter a chemical name.'); return; }
  if(!d.molWgt){ showToast('Please enter a molar mass.'); return; }
  const chem = JSON.parse(JSON.stringify(d));
  chem._custom = true;
  state.chemical = chem;
  if(save){
    state.customChemicals.push(JSON.parse(JSON.stringify(chem)));
    await persistChemicals();
    showToast('Chemical saved to database.');
  } else {
    showToast('Chemical set for this simulation.');
  }
  state.results = null;
  render();
}

async function commitEnvironmentDraft(){
  const d = state.environmentDraft;
  d.name = document.getElementById('ef-name').value.trim();
  d.airArea = parseFloat(document.getElementById('ef-airarea').value)||0;
  d.airDepth = parseFloat(document.getElementById('ef-airdepth').value)||0;
  d.waterArea = parseFloat(document.getElementById('ef-waterarea').value)||0;
  d.waterDepth = parseFloat(document.getElementById('ef-waterdepth').value)||0;
  d.soilDepth = parseFloat(document.getElementById('ef-soildepth').value)||0;
  d.sedimentDepth = parseFloat(document.getElementById('ef-sedimentdepth').value)||0;
  d.volFracAirAerosol = parseFloat(document.getElementById('ef-vf-airaerosol').value)||0;
  d.volFracWaterSusp = parseFloat(document.getElementById('ef-vf-watersusp').value)||0;
  d.volFracWaterFish = parseFloat(document.getElementById('ef-vf-waterfish').value)||0;
  d.volFracSoilAir = parseFloat(document.getElementById('ef-vf-soilair').value)||0;
  d.volFracSoilWater = parseFloat(document.getElementById('ef-vf-soilwater').value)||0;
  d.volFracSoilSolid = parseFloat(document.getElementById('ef-vf-soilsolid').value)||0;
  d.volFracSedimentWater = parseFloat(document.getElementById('ef-vf-sedwater').value)||0;
  d.volFracSedimentSolid = parseFloat(document.getElementById('ef-vf-sedsolid').value)||0;
  d.densAirAerosol = parseFloat(document.getElementById('ef-d-airaerosol').value)||0;
  d.densWaterWater = 1000;
  d.densWaterSusp = parseFloat(document.getElementById('ef-d-watersusp').value)||0;
  d.densWaterFish = parseFloat(document.getElementById('ef-d-waterfish').value)||0;
  d.densSoilSolid = parseFloat(document.getElementById('ef-d-soilsolid').value)||0;
  d.densSedimentSolid = parseFloat(document.getElementById('ef-d-sedsolid').value)||0;
  d.orgCarbSoil = parseFloat(document.getElementById('ef-oc-soil').value)||0;
  d.orgCarbSediment = parseFloat(document.getElementById('ef-oc-sed').value)||0;
  d.orgCarbSusp = parseFloat(document.getElementById('ef-oc-susp').value)||0;
  d.lipidFish = parseFloat(document.getElementById('ef-lipid-fish').value)||0;
  d.resTimeAir = parseFloat(document.getElementById('ef-rt-air').value)||0;
  d.resTimeWater = parseFloat(document.getElementById('ef-rt-water').value)||0;
  d.resTimeSediment = parseFloat(document.getElementById('ef-rt-sed').value)||0;
  const tv = {};
  for(let k=1;k<=12;k++){ tv[k] = parseFloat(document.getElementById('ef-tv-'+k).value)||0; }
  d.transVel = tv;
  d.scavenging = parseFloat(document.getElementById('ef-scavenging').value)||0;
  const save = document.getElementById('ef-save').checked;

  if(!d.name){ showToast('Please enter an environment name.'); return; }
  const env = JSON.parse(JSON.stringify(d));
  env._custom = true;
  state.environment = env;
  if(save){
    state.customEnvironments.push(JSON.parse(JSON.stringify(env)));
    await persistEnvironments();
    showToast('Environment saved to database.');
  } else {
    showToast('Environment set for this simulation.');
  }
  state.results = null;
  render();
}

function doCompute(){
  try{
    const results = runLevel3Model(state.chemical, state.environment, state.emissions);
    state.results = results;
    state.step = 'results';
    state.resultsTab = 'mass';
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    console.error(err);
    showToast('Calculation error — check inputs.');
  }
}

function setResultsTab(tab){ state.resultsTab = tab; render(); }
function setChartMode(mode){ state.chartMode = mode; render(); }

async function saveSimulation(){
  const record = {
    simId: state.simId, simComment: state.simComment,
    chemical: state.chemical, environment: state.environment, emissions: state.emissions,
    savedAt: Date.now()
  };
  state.savedSimulations.unshift(record);
  await persistSimulations();
  showToast('Simulation saved.');
  render();
}

function loadSavedSimulation(i){
  const s = state.savedSimulations[i];
  state.simId = s.simId; state.simComment = s.simComment||'';
  state.chemical = s.chemical; state.environment = s.environment; state.emissions = s.emissions;
  state.results = runLevel3Model(state.chemical, state.environment, state.emissions);
  state.step = 'results'; state.resultsTab = 'mass';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetAll(){
  state.step='id'; state.simId=''; state.simComment='';
  state.chemical=null; state.chemicalDraft=null; state.chemicalBaseIndex=-1;
  state.environment=null; state.environmentDraft=null; state.environmentBaseIndex=-1;
  state.emissions={...DEFAULT_EMISSIONS};
  state.results=null; state.resultsTab='chem';
  state.aiExplanation=null; state.aiChatLog=[]; state.aiQuestionDraft='';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// re-render chemical form when the chemical "type" selector changes, preserving
// whatever the person has already typed into the shared fields.
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='cf-type'){
    if(!state.chemicalDraft) state.chemicalDraft = newChemicalDraft();
    state.chemicalDraft.name = document.getElementById('cf-name').value;
    state.chemicalDraft.molWgt = document.getElementById('cf-molwgt').value;
    state.chemicalDraft.dataTemp = document.getElementById('cf-datatemp').value;
    state.chemicalDraft.type = parseInt(e.target.value,10);
    render();
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
render();
loadPersisted();
</script>
</body>
</html>
